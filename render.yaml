# ─────────────────────────────────────────────────────────────────────────────
# render.yaml — OmniSight full-stack deployment on Render
# Deploy from the repo root directory.
#
# Two services:
#  1. omnisight-backend  → Node.js Web Service (server/)
#  2. omnisight-frontend → Static Site       (dashboard/)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend (Express + Socket.io) ──────────────────────────────────────────
  - type: web
    name: omnisight-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000              # Render assigns PORT automatically; this is just a default
    autoDeploy: true

  # ── Frontend (React + Vite → Static Site) ──────────────────────────────────
  - type: web
    name: omnisight-frontend
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html    # SPA fallback — React Router handles all routes
    envVars:
      - key: VITE_BACKEND_URL
        # ⚠️  After deploying the backend, paste its Render URL here, e.g.:
        # value: https://omnisight-backend.onrender.com
        value: https://omnisight-backend.onrender.com
    autoDeploy: true
